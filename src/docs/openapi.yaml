openapi: 3.0.3

info:
  title: TypeScript Express REST API
  description: Product Management REST API Documentation
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://typescript-express-rest-api.vercel.app/api/v1
    description: Production Server
  - url: http://localhost:5000/api/v1
    description: Local Development Server

security: []

tags:
  - name: Health
    description: API health check
  - name: Products
    description: Product management endpoint

paths:
  /health:
    get:
      operationId: checkHealth
      tags:
        - Health
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "404":
          description: API is Unhealthy

  /products:
    post:
      operationId: createProduct
      tags:
        - Products
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCreatedResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    get:
      operationId: getProducts
      tags:
        - Products
      summary: Get all products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1

        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 100

        - in: query
          name: search
          schema:
            type: string

        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0

        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0

        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - price
              - name
              - createdAt
            default: createdAt

        - in: query
          name: sortOrder
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product UUID
        schema:
          type: string
          format: uuid
        example: "591f9a9e-528d-482c-bbd8-740a54b16079"
    get:
      operationId: getProductById
      tags:
        - Products
      summary: Get product by ID
      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags:
        - Products
      summary: Update products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduct"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Invalid product ID or product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags:
        - Products
      summary: Delete product
      responses:
        "200":
          description: Product delete successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: API is running
        data:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - healthy
              example: healthy

    DeleteResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product deleted successfully
        data:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Resource not found
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              example: PRODUCT_NOT_FOUND

    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: name
                  message:
                    type: string
                    example: Product name must be at least 3 characters
    ProductResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product retrieved successfully
        data:
          $ref: "#/components/schemas/Product"

    ProductListResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Products retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          type: object
          required:
            - page
            - limit
            - total
            - totalPages
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 25
            totalPages:
              type: integer
              example: 3

    ProductCreatedResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product Created Successfully
        data:
          $ref: "#/components/schemas/Product"

    CreateProduct:
      type: object
      required:
        - name
        - description
        - price
        - stock
        - category
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Samsung Galaxy Phone
        description:
          type: string
          minLength: 10
          maxLength: 1000
          example: Latest Samsung smartphone
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 1500
        stock:
          type: integer
          minimum: 0
          example: 10
        category:
          type: string
          minLength: 2
          example: Electronics
    UpdateProduct:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Samsung Galaxy S25 Ultra
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 1800
        stock:
          type: integer
          minimum: 0
          example: 20
    Product:
      allOf:
        - $ref: "#/components/schemas/CreateProduct"
        - type: object
          required:
            - id
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
